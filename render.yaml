services:
  - type: web
    name: piso-tabs-license-portal
    runtime: node
    plan: starter
    buildCommand: npm install --no-audit --no-fund && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: piso_tabs_licensing
      - key: APP_ORIGIN
        sync: false
      - key: SESSION_PEPPER
        generateValue: true
      - key: LICENSE_PEPPER
        generateValue: true
      - key: LICENSE_SIGNING_PRIVATE_KEY_B64
        sync: false
